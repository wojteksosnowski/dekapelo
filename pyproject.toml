[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dekapelo"
version = "0.1.0"
description = "Lokalny system audytu, bazy i analityki wskaźników projektów deweloperskich (DevAudit & BI)"
readme = "README.md"
authors = [{ name = "wojteksosnowski" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-multipart>=0.0.12",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "odfpy>=1.4.1",
    "sqlalchemy>=2.0.0",
    "jinja2>=3.1.4",
    "pytest>=8.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
